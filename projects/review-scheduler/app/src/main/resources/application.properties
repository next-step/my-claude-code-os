spring.application.name=app

# 로컬 1인 사용 앱이라 별도 DB 서버 없이 파일 기반 H2를 쓴다.
# 프로세스를 껐다 켜도 ./data 아래 파일에 데이터가 그대로 남는다.
spring.datasource.url=jdbc:h2:file:./data/review-scheduler
spring.datasource.driver-class-name=org.h2.Driver

# 스키마가 없으면 만들고, 있으면 그대로 둔 채 변경분만 반영한다.
# (엔티티가 Note 하나뿐인 작은 앱이라 update로 충분하다)
spring.jpa.hibernate.ddl-auto=update
