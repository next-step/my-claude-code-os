name: dispatch

# 라벨 이벤트를 라우팅하는 상태 머신 컨트롤러. LLM 호출 없음.
# PR 라벨(단일 소스)의 전이를 감시하고 적절한 워크플로를 트리거한다.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Route by label
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            const pr = context.payload.pull_request.number;
            core.info(`PR #${pr} 라벨 전이: ${label}`);

            switch (label) {
              case 'approved':
                // 구현 단계로 전이 → implement.yml 트리거
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'implement.yml',
                  ref: context.payload.pull_request.head.ref,
                  inputs: { pr: String(pr) },
                });
                break;

              case 'checks-failed:3':
                // 자동 재시도 중단 → 사람 개입 요청 + Discord 알림
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr,
                  labels: ['needs-human'],
                });
                if (process.env.DISCORD_WEBHOOK) {
                  await fetch(process.env.DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      content: `🚨 PR #${pr}: 체크 3회 실패, 자동 재시도 중단. 사람 개입 필요.`,
                    }),
                  });
                }
                break;

              default:
                core.info('라우팅 대상 아님 — no-op');
            }
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
